name: Autogamivoid run (reusable)

on:
  workflow_call:
    inputs:
      action:
        description: 'Which run action: sync | catalog | updates'
        required: true
        type: string
      action_limit:
        description: 'Max publish actions this run (resume continues next run)'
        required: false
        type: string
        default: '200'
      seconds_limit:
        description: 'Wall-clock budget per run in seconds'
        required: false
        type: string
        default: '2700'
      dry_run:
        description: 'Validate without writing to gamivoid'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autogamivoid-${{ inputs.action }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTOGAMIVOID_CONFIG: autogamivoid/config.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Default (true) persists the workflow token so the state-commit
          # step can push at the end of the run.
          persist-credentials: true

      - uses: actions/setup-rust-toolchain@v1
        with:
          rustup-toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a567450d5838078e36cf38b85af677262
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-autogamivoid-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-autogamivoid-

      - name: Write config from secrets
        run: |
          mkdir -p autogamivoid
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          base = Path(os.environ["AUTOGAMIVOID_CONFIG"])
          base.parent.mkdir(parents=True, exist_ok=True)

          config = {
              "gamivoid_api_base": os.environ.get("GAMIVOID_API_BASE", "https://gamivoid.site"),
              "gamivoid_publishing_key": os.environ["GAMIVOID_PUBLISHING_KEY"],
              "steam_api_key": os.environ.get("STEAM_WEB_API_KEY") or None,
              "sources": {
                  "steamrip": {
                      "base_url": os.environ.get("STEAMRIP_BASE_URL", "https://steamrip.com"),
                      "headers": {}
                  },
                  "steamunlocked": {
                      "base_url": os.environ.get("STEAMUNLOCKED_BASE_URL", "https://steamunlocked.net"),
                      "headers": {}
                  },
              },
              "batch": {
                  "action_limit": int(os.environ.get("AUTOGAMIVOID_ACTION_LIMIT", "200")),
                  "seconds_limit": int(os.environ.get("AUTOGAMIVOID_SECONDS_LIMIT", "2700")),
                  "request_pause_ms": int(os.environ.get("AUTOGAMIVOID_REQUEST_PAUSE_MS", "250")),
              },
              "state_path": "autogamivoid/state.json",
              "dry_run": os.environ.get("AUTOGAMIVOID_DRY_RUN", "false") == "true",
          }

          base.write_text(json.dumps(config, indent=2), encoding="utf-8")
          PY
        env:
          GAMIVOID_PUBLISHING_KEY: ${{ secrets.GAMIVOID_PUBLISHING_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          STEAMRIP_BASE_URL: ${{ secrets.STEAMRIP_BASE_URL }}
          STEAMUNLOCKED_BASE_URL: ${{ secrets.STEAMUNLOCKED_BASE_URL }}
          AUTOGAMIVOID_ACTION_LIMIT: ${{ inputs.action_limit }}
          AUTOGAMIVOID_SECONDS_LIMIT: ${{ inputs.seconds_limit }}
          AUTOGAMIVOID_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

      - name: Build autogamivoid
        run: cargo build -p autogamivoid --release

      - name: Run (${{ inputs.action }})
        run: |
          if [ -z "$GAMIVOID_PUBLISHING_KEY" ]; then
            echo "::warning::GAMIVOID_PUBLISHING_KEY secret is not set - forcing dry-run (no writes)"
            cargo run -p autogamivoid --release -- --action ${{ inputs.action }} --dry-run
          else
            cargo run -p autogamivoid --release -- --action ${{ inputs.action }}
          fi
        env:
          AUTOGAMIVOID_CONFIG: autogamivoid/config.json
          GAMIVOID_PUBLISHING_KEY: ${{ secrets.GAMIVOID_PUBLISHING_KEY }}

      - name: Commit updated state
        run: |
          git config user.email "autogamivoid@github-actions.example"
          git config user.name "autogamivoid"
          git add autogamivoid/state.json autogamivoid/published-games.json 2>/dev/null || true
          if git diff --cached --exit-code; then
            echo "State files unchanged"
          else
            git commit -m "autogamivoid: update state after ${{ inputs.action }} run" || true
            git push
          fi
