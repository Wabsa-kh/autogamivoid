name: Autogamivoid run simple

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      action_limit:
        required: false
        type: string
        default: '200'
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autogamivoid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTOGAMIVOID_CONFIG: autogamivoid.config.json
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Echo flags
        run: echo "action=${{ inputs.action }} limit=${{ inputs.action_limit }} dry=${{ inputs.dry_run && 'yes' || 'no' }}"
